<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ALL INS Leave Tracker</title>
<meta name="theme-color" content="#F4F2EE">
<meta name="description" content="Leave tracker for ALL INS: balances, department calendar and manager notifications.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leave Tracker">
<style>
:root{
  --bg:#F4F2EE; --card:#FFFFFF; --ink:#2A2926; --mute:#6E6962; --line:#E3DFD7;
  --accent:#E8710A; --accent-ink:#B84F00; --accent-soft:#FDEBDB;
  --sage:#BCC9B7; --slate:#B5C2CF; --sand:#E2D6BD; --stone:#D9D5CD; --wash:#FAF9F6;
  --r:18px;
}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
h2{font-size:1.2rem;margin:0 0 4px}
.sub{color:var(--mute);font-size:.9rem}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.grow{flex:1}

/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);display:grid;place-items:center}
.logo svg{width:26px;height:26px}
.brand b{display:block;font-size:1.15rem;line-height:1.1}
.brand small{color:var(--mute);font-size:.8rem}
.chipdept{display:inline-block;background:var(--stone);border-radius:99px;padding:2px 12px;font-size:.85rem;margin-left:6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;min-height:44px}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1F1D1A;font-weight:700}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mute)}
.bell{position:relative}
.bell .n{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#1F1D1A;font-weight:700;font-size:.75rem;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 5px}

/* login */
.login{max-width:560px;margin:8vh auto 0}
.people{display:grid;gap:10px;margin-top:12px}
.person{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.person:hover{border-color:var(--accent);background:var(--wash)}
.person small{color:var(--mute)}
.dept-h{margin:18px 0 0;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
input[type=text],input[type=password],input[type=email],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);min-height:46px}
label.f{display:block;margin-top:14px;font-size:.9rem;color:var(--mute)}
.err{color:var(--accent-ink);margin-top:10px;font-weight:600}

/* balances */
.bal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:14px}
.bal{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--wash)}
.bal .l{font-size:.9rem;color:var(--mute)}
.bal .v{font-size:2.4rem;font-weight:700;line-height:1.15;margin:2px 0}
.bal .v.neg{color:var(--accent-ink)}
.bal .s{font-size:.82rem;color:var(--mute)}
.bal.hi{border-color:var(--accent);background:var(--accent-soft)}

/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-head h2{margin:0 6px;min-width:11ch;text-align:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px}
.tab[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--mute);margin:4px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{font-size:.8rem;color:var(--mute);text-align:center;padding:2px 0;text-transform:uppercase;letter-spacing:.06em}
.cell{min-height:104px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
.cell.blank{border:none;background:transparent;pointer-events:none}
.cell.wk{background:var(--wash)}
.cell:hover:not(.blank){border-color:var(--accent)}
.cell .d{font-weight:700;font-size:1rem}
.cell.today .d{background:var(--accent);color:#1F1D1A;border-radius:99px;min-width:28px;height:28px;display:inline-grid;place-items:center;padding:0 4px}
.cell.over{border:2px solid var(--accent);background:var(--accent-soft)}
.cell.mine{box-shadow:inset 0 0 0 2px var(--ink)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0}
.bdg{font-style:normal;font-size:.7rem;font-weight:700;background:var(--accent);color:#1F1D1A;border-radius:99px;padding:1px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip{display:flex;align-items:center;gap:4px;border-radius:7px;padding:1px 6px;font-size:.78rem;line-height:1.35;overflow:hidden;white-space:nowrap}
.chip i{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.chip b{font-weight:700;opacity:.7}
.t-AL{background:var(--sage)} .t-MC{background:var(--slate)} .t-TR{background:var(--sand)}
.t-CCL,.t-BDL,.t-ML,.t-HL,.t-UL,.t-UPL,.t-X{background:var(--stone)}
.phl{font-style:normal;font-size:.68rem;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:0 5px;margin-left:4px}
.policy li{margin:6px 0}
.t-WFH{background:transparent;border:1px dashed var(--mute)}
.more{font-size:.75rem;color:var(--mute)}
@media(max-width:640px){
  html{font-size:17px}
  .grid{gap:3px}
  .cell{min-height:68px;padding:4px}
  .cell .d{font-size:.9rem}
  .chip{width:11px;height:11px;border-radius:50%;padding:0;display:inline-block}
  .chip i,.chip b{display:none}
  .cell .chips{display:flex;flex-wrap:wrap;gap:3px}
  .bdg{position:absolute;font-size:.7rem;padding:0 7px;bottom:4px;right:4px}
  .bdg .x{display:none}
  .bal-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .bal{padding:12px}
  .bal .v{font-size:2rem}
}

/* lists */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.pill{border-radius:8px;padding:2px 10px;font-size:.85rem;white-space:nowrap}
.note{border-left:5px solid var(--line);padding:6px 0 6px 14px;margin:10px 0}
.note.warn{border-color:var(--sand)} .note.alert{border-color:var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
.note.unread .t{font-weight:700}
.note .m{font-size:.8rem;color:var(--mute)}
.note.click{cursor:pointer} .note.click:hover{background:var(--stone)}
.sr{position:absolute;left:-9999px}
.steps{margin:12px 0;padding-left:22px}.steps li{margin:6px 0}
.tag{display:inline-block;background:var(--accent);color:#1F1D1A;font-size:.72rem;font-weight:700;border-radius:99px;padding:0 9px;margin-right:8px;vertical-align:1px}
.tag.fyi{background:var(--stone);font-weight:600}
.tag.ok{background:var(--sage);font-weight:700}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.note .x.ok{color:var(--ink);font-weight:600}
.chip.pend{outline:2px dashed var(--ink);outline-offset:-2px}
.note .x{font-size:.92rem;color:var(--accent-ink)}

/* sheet */
#overlay{position:fixed;inset:0;background:rgba(42,41,38,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
#overlay.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:640px){#overlay{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-size:1.35rem}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.seg label{position:relative;border:2px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;font-weight:600;font-size:.95rem}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{display:block}
.seg label:has(input:disabled){opacity:.45;cursor:not-allowed}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.warnbox{margin-top:14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent);padding:10px 14px;font-size:.92rem}
.warnbox ul{margin:6px 0 0;padding-left:20px}
.okbox{margin-top:14px;border-radius:12px;background:var(--wash);border:1px solid var(--line);padding:10px 14px;font-size:.92rem}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.actions .primary{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.two{grid-template-columns:1fr}}

/* toast */
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;display:none;gap:14px;align-items:center;max-width:92vw;z-index:60;font-size:.95rem}
#toast.on{display:flex}
#toast a{color:#FFC48A;font-weight:700}
.footer{color:var(--mute);font-size:.8rem;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="overlay" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- constants ---------- */
const KEY = 'allins-leave-v2';
const TYPES = {
  AL:{name:'Annual Leave',code:'AL'}, MC:{name:'Medical Leave',code:'MC'}, TR:{name:'Training',code:'TR'},
  CCL:{name:'Child Care Leave',code:'CCL'}, BDL:{name:'Birthday Leave',code:'BDL'}, ML:{name:'Maternity Leave',code:'ML'},
  WFH:{name:'Work From Home',code:'WFH'}, HL:{name:'Hospital Leave',code:'HL'},
  UL:{name:'Urgent Leave',code:'UL'}, UPL:{name:'Unpaid Leave',code:'UPL'}
};
const BAL = ['AL','CCL','BDL','ML','WFH','HL','MC'];     // cards shown on the balance panel
const OTHER = ['CCL','BDL','ML','WFH','HL','UL','UPL'];             // extra choices in the apply sheet
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmt = s => parse(s).toLocaleDateString('en-SG', {weekday:'short', day:'numeric', month:'short'});
const fmtShort = s => parse(s).toLocaleDateString('en-SG', {day:'numeric', month:'short'});
const first = n => String(n).split(' ')[0];
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const num = n => (Math.round(n * 2) / 2).toString();
const PARTS = {FULL: 'Full day', AM: 'Half day AM', PM: 'Half day PM'};
const partOf = l => l.part || 'FULL';                                  // older records have no part: full day
/* Public holidays: MOM's official list (data.gov.sg) fetched and cached, plus anything the administrator added. */
const MOM_IDS = ['d_8ef23381f9417e4d4254ee8b4dcdb176', 'd_0ba69fc6d56717ff0bf8083c6af3bb84'];    // MOM consolidated 2020-2026, and 2027
const MOM_KEY = 'allins-ph-mom';
let momPH = (() => { try { return JSON.parse(localStorage.getItem(MOM_KEY)) || {ts: 0, list: []}; } catch (e) { return {ts: 0, list: []}; } })();
let phMap = null;
const phAll = () => { if (!phMap) { phMap = new Map(); (db.ph || []).forEach(x => phMap.set(x.d, {d: x.d, name: x.name, src: 'Added'})); momPH.list.forEach(x => phMap.set(x.d, {d: x.d, name: x.name, src: 'MOM'})); } return [...phMap.values()]; };
const phOf = d => { phAll(); return phMap.get(d); };
async function fetchMomPH(force) {
  if (!force && Date.now() - momPH.ts < 864e5) return false;
  try {
    const js = await Promise.all(MOM_IDS.map(id => fetch(`https://data.gov.sg/api/action/datastore_search?resource_id=${id}&limit=500`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })));
    const list = []; js.forEach(j => ((j.result && j.result.records) || []).forEach(r => { if (/^\d{4}-\d{2}-\d{2}$/.test(r.date) && r.holiday) list.push({d: r.date, name: String(r.holiday)}); }));
    if (!list.length) return false;
    const changed = JSON.stringify(list) !== JSON.stringify(momPH.list);
    momPH = {ts: Date.now(), list}; localStorage.setItem(MOM_KEY, JSON.stringify(momPH)); phMap = null;
    if (changed && !$('#overlay').classList.contains('on') && !(ui.me === null && ui.login.pid)) render();
    return true;
  } catch (e) { return false; }
}
const isEarly = d => (db.early || []).some(x => x.d === d);
const fullOnly = d => !!d && (parse(d).getDay() === 6 || isEarly(d));      // Saturday duty and early-release days always count as a full day
const valOf = l => phOf(l.date) ? 0 : (partOf(l) === 'FULL' || fullOnly(l.date)) ? 1 : 0.5;      // a public holiday is never deducted
const dayVal = (d, part) => phOf(d) ? 0 : (part === 'FULL' || fullOnly(d)) ? 1 : 0.5;
const weekKey = d => { const x = parse(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return ymd(x); };   // Monday of that week
const covers = (part, half) => part === 'FULL' || part === half;      // does this part include the AM / PM half?
const overlap = (a, b) => a === 'FULL' || b === 'FULL' || a === b;
const daysText = n => n === 1 ? '1 day' : `${num(n)} days`;
const rangeText = ds => ds.length === 1 ? fmtShort(ds[0]) : `${fmtShort(ds[0])} – ${fmtShort(ds[ds.length-1])}`;

/* ---------- storage (local-first; swap load/save for a server later) ---------- */
const JOEY_APPROVES = ['Belle', 'Violet', 'Shayne'];     // Joey Tay approves these three; everyone else is approved by Belle
function defaultPH() {      // Singapore public holidays (MOM). The administrator can edit this list.
  const L = [['2026-12-25','Christmas Day'],['2027-01-01','New Year’s Day'],['2027-02-06','Chinese New Year'],['2027-02-08','Chinese New Year (observed)'],['2027-03-10','Hari Raya Puasa'],['2027-03-26','Good Friday'],
    ['2027-05-01','Labour Day'],['2027-05-17','Hari Raya Haji'],['2027-05-20','Vesak Day'],['2027-08-09','National Day'],['2027-10-28','Deepavali'],['2027-12-25','Christmas Day']];
  return L.map(([d, name]) => ({d, name}));
}
function seed() {
  const ent = o => ({AL:14, CCL:6, BDL:1, ML:0, WFH:0, HL:60, MC:14, ...o});
  const mk = (id, name, dept, role, approver) => ({id, name, dept, role, approver, email:'', pin:'', ent:ent(), bf:0, bmonth:0});
  const A = n => n === 'Joey Tay' ? '' : JOEY_APPROVES.includes(n) ? 'p11' : 'p1';      // Joey Tay has no approving manager
  const rows = [['p1','Belle','Sales','manager'], ['p2','Wyonna','Sales'], ['p3','Jia Liang','Sales'], ['p4','Serene','Sales'],
    ['p5','Lena','Ops'], ['p6','Zhi Shan','Ops'], ['p7','Coco','Ops'], ['p8','Shayne','Ops'],
    ['p9','Violet','Accounts'], ['p10','Joey Chan','Accounts'], ['p11','Joey Tay','Management','manager']];
  const admin = {id:'p0', name:'Admin', dept:'Admin', role:'admin', approver:'', email:'', pin:'', ent:ent(), bf:0, bmonth:0};
  return {v:9, ph: defaultPH(), early: [], depts:['Sales','Ops','Accounts','Management'], leaves:[], notes:[],
    people: [admin, ...rows.map(([id, name, dept, role]) => mk(id, name, dept, role || 'staff', A(name)))]};
}
function migrate(d) {
  const byName = n => d.people.find(p => p.name === n);
  if ((d.v || 0) < 3) {          // v2 -> v3: the approving manager (then saved as "Joey Chan") becomes a manager
    const belle = byName('Belle'), joey = byName('Joey Chan') || byName('Joey Tay');
    if (joey) joey.role = 'manager';
    d.people.forEach(p => { if (!p.approver) p.approver = (joey && JOEY_APPROVES.includes(p.name)) ? joey.id : (belle ? belle.id : ''); });
  }
  if ((d.v || 0) < 5) {          // v5: Joey Tay (approving manager, Management) and Joey Chan (Accounts) are two different people
    const belle = byName('Belle');
    let tay = byName('Joey Tay'), chan = byName('Joey Chan');
    if (chan && !tay && chan.role === 'manager') { chan.name = 'Joey Tay'; tay = chan; chan = null; }   // the single Joey record was the manager
    if (tay) { tay.dept = 'Management'; tay.role = 'manager'; }
    if (!d.depts.includes('Management')) d.depts.push('Management');
    if (!byName('Joey Chan')) d.people.push({id: uid(), name: 'Joey Chan', dept: 'Accounts', role: 'staff', approver: belle ? belle.id : '', email: '', pin: '',
      ent: {AL:14, CCL:6, BDL:1, ML:0, WFH:0, HL:60, MC:14}, bf: 0, bmonth: 0});
    (d.notes || []).forEach(n => { ['text', 'detail'].forEach(k => { n[k] = String(n[k] || '').split('Joey Chan').join('Joey Tay').split('Joey Tay (Accounts)').join('Joey Tay (Management)'); }); });
  }
  if ((d.v || 0) < 6 && !d.people.some(p => p.role === 'admin'))      // v6: an Admin user who can change approving managers
    d.people.push({id: d.people.some(p => p.id === 'p0') ? uid() : 'p0', name: 'Admin', dept: 'Admin', role: 'admin', approver: '', email: '', pin: '', ent: {AL:0, CCL:0, BDL:0, ML:0, WFH:0, HL:0, MC:0}, bf: 0, bmonth: 0});
  if ((d.v || 0) < 8) {          // v8: re-apply the agreed roster and approvers
    const belle = byName('Belle'), tay = byName('Joey Tay'), chan = byName('Joey Chan');
    if (tay) { tay.dept = 'Management'; tay.role = 'manager'; }
    if (chan) { chan.dept = 'Accounts'; if (chan.role === 'manager') chan.role = 'staff'; }
    if (tay && belle) d.people.forEach(p => { if (p.role === 'admin' || p.id === tay.id) return; p.approver = JOEY_APPROVES.includes(p.name) ? tay.id : belle.id; });
    if (tay) tay.approver = '';
  }
  if ((d.v || 0) < 9) {          // v9: Joey Tay has no approving manager; his leave needs no approval
    const tay = byName('Joey Tay'); if (tay) { tay.approver = ''; d.leaves.forEach(l => { if (l.pid === tay.id && l.status === 'pending') l.status = 'approved'; }); }
  }
  if (!Array.isArray(d.ph)) d.ph = defaultPH();
  if (!Array.isArray(d.early)) d.early = [];
  d.v = 9; return d;
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.people)) { const v0 = d.v; migrate(d); if (d.v !== v0) localStorage.setItem(KEY, JSON.stringify(d)); return d; }
  } catch (e) {}
  return seed();
}
function save() { localStorage.setItem(KEY, JSON.stringify(db)); phMap = null; }
let db = load();

/* ---------- UI state ---------- */
const ui = {
  me: sessionStorage.getItem('allins-me') || null,
  view: 'home', month: new Date(new Date().getFullYear(), new Date().getMonth(), 1), dept: null,
  login: {pid: null, err: ''}
};
let sheet = null;
let swReg = null;
if ('serviceWorker' in navigator) navigator.serviceWorker.ready.then(r => { swReg = r; }).catch(() => {});
function sysNotify(title, body, tag) {         // device notification: needs permission, works best installed
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const o = {body, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: tag || 'leave'};
  try { if (swReg) swReg.showNotification(title, o); else new Notification(title, o); } catch (e) {}
}
function setBadge(n) {
  document.title = (n ? `(${n}) ` : '') + 'ALL INS Leave Tracker';
  try { if (navigator.setAppBadge) (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {}); } catch (e) {}
}
function alertCheck() {                        // tell a signed-in manager about alerts this device hasn't shown yet

  const early = mine.filter(l => l.type === 'AL' && l.date < Y + '-07-01').reduce((a, l) => a + valOf(l), 0);
  const bf = ymd(now) < Y + '-07-01' ? (Number(p.bf) || 0) : Math.min(Number(p.bf) || 0, early);

    const lim = new Date(today); lim.setMonth(lim.getMonth() + 3);

  const skipped = []; if (v.toRaw && v.toRaw !== v.from) for (let d = parse(v.from), e = parse(v.toRaw), n = 0; d <= e && n < 120; d = new Date(d.getTime() + 864e5), n++) { const k = ymd(d); if (phOf(k) && d.getDay() % 6) skipped.push(`${fmtShort(k)} ${phOf(k).name}`); }
  const phNote = skipped.length ? `<div class="okbox" style="margin-top:8px">Public holiday${skipped.length > 1 ? 's' : ''} not counted: ${esc(skipped.join(', '))}.</div>` : '';
  box.innerHTML = phNote + (items.length ? `<div class="warnbox"><b>Heads up</b><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul><div style="margin-top:6px">${notifyLine(me)} will be notified${wfh ? ' (no approval needed)' : ''}${conf.some(c => c.over) ? ' with an over-limit alert' : ''}.</div></div>`
    : `<div class="okbox">No clashes. ${daysText(days)}${v.part === 'FULL' ? '' : ' · ' + PARTS[v.part]} · ${notifyLine(me)} will be notified${wfh ? ' (no approval needed)' : ''}.</div>`);
  go.textContent = wfh ? (items.length ? 'Save WFH anyway' : 'Save WFH') : items.length ? 'Apply anyway' : v.dates.length > 1 ? `Apply ${v.dates.length} days` : v.part !== 'FULL' ? `Apply ${PARTS[v.part]}` : 'Apply leave';
}
function submitLeave() {
  const me = cur(), v = sheetVals(); if (!v.dates.length) return;
  const conf = conflicts(me, v.dates, v.part), batch = uid(), rules = ruleWarnings(me, v.type, v.dates, v.part);
  // replace anything of mine that overlaps: a full day replaces both halves, AM replaces AM/full, PM replaces PM/full
  db.leaves = db.leaves.filter(l => !(l.pid === me.id && v.dates.includes(l.date) && overlap(v.part, partOf(l))));
  v.dates.forEach((d, i) => db.leaves.push({id: uid(), pid: me.id, date: d, type: v.type, part: v.part, status: (v.type === 'WFH' || !me.approver) ? 'approved' : 'pending', buddy: v.buddy, note: v.note, batch, created: Date.now(), flags: i === 0 ? rules : undefined}));
  const mgrs = notifyManagers(me, v.type, v.dates, conf, v.part, batch, rules);
  save(); closeSheet(); render();
  const m = mgrs.find(x => x.id === me.approver && x.email) || mgrs.find(x => x.email);
  if (!mgrs.length) return toast('Saved. There is no other manager to notify.');
  const body = `${me.name} applied for ${TYPES[v.type].name}, ${rangeText(v.dates)}${v.part === 'FULL' ? '' : ', ' + PARTS[v.part]} (${daysText(v.dates.reduce((a, d) => a + dayVal(d, v.part), 0))}).` + (v.note ? `\nRemarks: ${v.note}` : '') + (v.buddy ? `\nBuddy: ${v.buddy}` : '') + (conf.length ? `\nClash: ${conf.map(c => fmtShort(c.date) + ' ' + c.others.map(o => first(o.name)).join('/') + ' away').join('; ')}` : '');
  toast(`${(v.type === 'WFH' || !me.approver) ? 'Saved, no approval needed.' : 'Sent for approval.'} ${mgrs.map(x => first(x.name)).join(', ')} notified.`, m ? {href: `mailto:${m.email}?subject=${encodeURIComponent('Leave application: ' + me.name)}&body=${encodeURIComponent(body)}`, label: 'Also email'} : null);
}
function closeSheet() { $('#overlay').classList.remove('on'); $('#overlay').innerHTML = ''; sheet = null; }

/* ---------- admin: change approving manager ---------- */
function setApprover(pid, newId) {
  const admin = cur(), p = db.people.find(x => x.id === pid), to = db.people.find(x => x.id === newId);
  if (newId === '' && p && isMgr(p) && isAdmin(admin) && p.approver) { p.approver = ''; db.leaves.forEach(l => { if (l.pid === p.id && isPending(l)) l.status = 'approved'; }); save(); render(); return toast(`${p.name} no longer needs approval.`); }
  if (!isAdmin(admin) || !p || !to || !isMgr(to) || to.id === p.id || p.approver === newId) return render();
  const from = db.people.find(x => x.id === p.approver); p.approver = newId;
  const batches = new Set(db.leaves.filter(l => l.pid === pid && isPending(l)).map(l => l.batch));    // pending requests move to the new approver
  db.notes.filter(n => batches.has(n.batch) && !n.outcome).forEach(n => { if (n.to === newId) n.tag = 'approval'; else if (from && n.to === from.id) n.tag = 'fyi'; });
  const text = `${admin.name} changed ${p.name}’s approving manager${from ? ' from ' + from.name : ''} to ${to.name}`;
  const detail = batches.size ? `${batches.size} pending request${batches.size > 1 ? 's' : ''} moved to ${to.name} for approval` : '';
  [...new Set([p.id, to.id, from && from.id].filter(Boolean))].forEach(id => { const r = db.people.find(x => x.id === id); if (r) pushNote(admin, r, text, id === to.id ? detail : '', 'info', {tag: 'fyi'}); });
  save(); render(); toast(`${p.name}’s leave is now approved by ${to.name}.`);
}

/* ---------- team editor ---------- */
const defaultApprover = self => { const b = db.people.find(p => p.name === 'Belle' && isMgr(p)) || db.people.find(p => isMgr(p) && p.id !== self); return b ? b.id : ''; };
function openPerson(id) {
  const p = id ? db.people.find(x => x.id === id) : {id: '', name: '', dept: db.depts[0] || '', role: 'staff', email: '', ent: {AL:14, CCL:6, BDL:1, ML:0, WFH:0, HL:60, MC:14}, bf: 0, bmonth: 0};
  const E = t => `<div><label class="f" for="e_${t}">${TYPES[t].name}</label><input type="number" id="e_${t}" min="0" step="0.5" value="${p.ent[t] ?? 0}"></div>`;
  $('#overlay').innerHTML = `<form class="sheet" id="personForm"><h2>${id ? 'Edit person' : 'Add person'}</h2>
    <label class="f" for="pn">Name</label><input type="text" id="pn" value="${esc(p.name)}" required>
    <div class="two"><div><label class="f" for="pd">Department</label><input type="text" id="pd" list="dl" value="${esc(p.dept)}" required><datalist id="dl">${db.depts.map(d => `<option>${esc(d)}</option>`).join('')}</datalist></div>
    <div><label class="f" for="pr">Role</label><select id="pr"><option value="staff" ${p.role === 'staff' ? 'selected' : ''}>Staff</option><option value="manager" ${p.role === 'manager' ? 'selected' : ''}>Manager</option></select></div></div>
    ${isAdmin(cur()) ? `<label class="f" for="pa">Approving manager</label><select id="pa"><option value="" ${p.approver ? '' : 'selected'}>None (no approval needed)</option>${db.people.filter(m => isMgr(m) && m.id !== id).map(m => `<option value="${m.id}" ${p.approver === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>`
      : `<div class="sub" style="margin-top:12px">Approving manager: <b>${esc((db.people.find(x => x.id === p.approver) || {name: id ? 'none (no approval needed)' : 'Belle (default)'}).name)}</b>. Only the administrator can change this.</div>`}
    <label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pc" style="width:auto" ${p.confirmed === false ? '' : 'checked'}> Confirmed staff (eligible for work from home)</label>
    <label class="f" for="pe">Email (for “Also email” on notifications)</label><input type="email" id="pe" value="${esc(p.email)}">
    <div class="two"><div><label class="f" for="pb">Annual leave brought forward</label><input type="number" id="pb" min="0" step="0.5" value="${p.bf || 0}"></div>
    <div><label class="f" for="pm">Birthday month</label><select id="pm"><option value="0">Not set</option>${MONTHS.map((m, i) => `<option value="${i+1}" ${p.bmonth === i+1 ? 'selected' : ''}>${m}</option>`).join('')}</select></div></div>
    <h2 style="margin-top:20px">Yearly entitlement (days)</h2><div class="two">${BAL.map(E).join('')}</div>
    <div class="sub" style="margin-top:8px">Annual leave: 14 for staff, up to 16 for executives. Brought forward is capped at 50% of entitlement.</div>
    <div class="actions"><button type="button" class="btn" data-a="close">Cancel</button>${id && id !== ui.me ? '<button type="button" class="btn" data-a="reset-pin" data-id="' + id + '">Reset PIN</button>' : ''}${id && id !== ui.me ? '<button type="button" class="btn danger" data-a="del-person" data-id="' + id + '">Delete</button>' : ''}<button class="btn primary">Save</button></div></form>`;
  $('#overlay').classList.add('on');
  $('#personForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#pn').value.trim(), dept = $('#pd').value.trim(); if (!name || !dept) return;
    const ent = {}; BAL.forEach(t => ent[t] = Number($('#e_' + t).value) || 0);
    const bf = Math.min(Number($('#pb').value) || 0, ent.AL * 0.5);
    const rec = id ? db.people.find(x => x.id === id) : {id: uid(), pin: ''};
    Object.assign(rec, {name, dept, role: $('#pr').value, approver: $('#pa') ? $('#pa').value : (rec.approver !== undefined && id ? rec.approver : defaultApprover(rec.id)), email: $('#pe').value.trim(), confirmed: $('#pc').checked, ent, bf, bmonth: Number($('#pm').value)});
    if (!id) db.people.push(rec);
    notifyTeam(cur(), id ? `${cur().name} updated ${name}’s details or entitlements` : `${cur().name} added ${name} to ${dept}`);
    if (!db.depts.includes(dept)) db.depts.push(dept);
    save(); closeSheet(); render();
  });
}

/* ---------- toast ---------- */
let toastT;
function toast(msg, link) {
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${link ? `<a href="${link.href}">${esc(link.label)}</a>` : ''}`;
  t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 9000);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) { if (e.target.id === 'overlay') closeSheet(); return; }
  const me = cur(), a = el.dataset.a, id = el.dataset.id;
  switch (a) {
    case 'pick': ui.login = {pid: id, err: ''}; render(); break;
    case 'back': ui.login = {pid: null, err: ''}; render(); break;
    case 'logout': ui.me = null; sessionStorage.removeItem('allins-me'); ui.login = {pid: null, err: ''}; ui.view = 'home'; closeSheet(); render(); break;
    case 'view': ui.view = el.dataset.v; render(); break;
    case 'month': ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() + Number(el.dataset.n), 1); render(); break;
    case 'today': { const n = new Date(); ui.month = new Date(n.getFullYear(), n.getMonth(), 1); render(); break; }
    case 'dept': ui.dept = el.dataset.d; render(); break;
    case 'day': if (isAdmin(me)) toast('The administrator account doesn’t take leave.'); else openSheet(el.dataset.d); break;
    case 'close': closeSheet(); break;
    case 'del': case 'del-sheet': {
      const gone = db.leaves.find(l => l.id === id); db.leaves = db.leaves.filter(l => l.id !== id);
      if (gone && me) cancelNotice(me, gone);
      save(); if (a === 'del-sheet') closeSheet(); render(); break;
    }
    case 'bell': { const n = $('#notes'); if (n) n.scrollIntoView({behavior: 'smooth'}); break; }
    case 'ph-add': { const d = $('#phd').value; if (d && isAdmin(me)) { db.ph = (db.ph || []).filter(x => x.d !== d).concat({d, name: $('#phn').value.trim() || 'Public holiday'}); save(); render(); } break; }
    case 'ph-refresh': fetchMomPH(true).then(ok => { render(); toast(ok ? 'Public holidays updated from MOM.' : 'Couldn’t reach MOM’s list. The saved list is still used.'); }); break;
    case 'ph-del': db.ph = (db.ph || []).filter(x => x.d !== el.dataset.d); save(); render(); break;
    case 'er-add': { const d = $('#erd').value; if (d && isAdmin(me)) { db.early = (db.early || []).filter(x => x.d !== d).concat({d, note: $('#ern').value.trim() || 'Early release'}); save(); render(); } break; }
    case 'er-del': db.early = (db.early || []).filter(x => x.d !== el.dataset.d); save(); render(); break;
    case 'open-req': openRequest(el.dataset.b, el.dataset.n); break;
    case 'approve': case 'decline': decide(el.dataset.b, a === 'approve'); break;
    case 'read-all': db.notes.filter(n => n.to === me.id).forEach(n => n.read = true); save(); render(); break;
    case 'enable-push': Notification.requestPermission().then(r => { render(); if (r === 'granted') sysNotify('Notifications are on', 'You’ll be alerted here when a leave update comes in.', 'test'); }); break;
    case 'test-push': sysNotify('Test notification', 'This is how leave alerts will appear on this device.', 'test'); toast('Test notification sent.'); break;
    case 'edit': openPerson(id); break;
    case 'reset-pin': if (id !== ui.me && confirm('Reset ' + db.people.find(p => p.id === id).name + '’s PIN? Their old PIN stops working and they create a new one next time they sign in.')) { const who = db.people.find(p => p.id === id); who.pin = ''; notifyTeam(cur(), `${cur().name} reset ${who.name}’s PIN`); save(); closeSheet(); render(); toast(`PIN reset for ${who.name}. They create a new PIN at their next sign-in.`); } break;
    case 'del-person': if (confirm('Delete this person and all their leave records?')) { notifyTeam(cur(), `${cur().name} removed ${db.people.find(p => p.id === id).name}`); db.people = db.people.filter(p => p.id !== id); db.leaves = db.leaves.filter(l => l.pid !== id); db.notes = db.notes.filter(n => n.to !== id && n.from !== id); save(); closeSheet(); render(); } break;
    case 'export': { const b = new Blob([JSON.stringify(db, null, 2)], {type: 'application/json'}), u = URL.createObjectURL(b), x = document.createElement('a'); x.href = u; x.download = `leave-tracker-${ymd(new Date())}.json`; x.click(); URL.revokeObjectURL(u); break; }
  }
});
document.addEventListener('submit', async e => {
  if (e.target.dataset.form !== 'pin') return;
  e.preventDefault();
  const p = db.people.find(x => x.id === ui.login.pid), pin = $('#pin').value;
  if (!/^\d{4,8}$/.test(pin)) { ui.login.err = 'Use 4 to 8 digits.'; return render(); }
  if (!p.pin) {
    if (pin !== $('#pin2').value) { ui.login.err = 'The two PINs don’t match.'; return render(); }
    p.pin = await hashPin(pin, p.id); save();
  } else if (p.pin !== await hashPin(pin, p.id)) { ui.login.err = 'That PIN is not right.'; return render(); }
  ui.me = p.id; sessionStorage.setItem('allins-me', p.id); ui.login = {pid: null, err: ''}; ui.view = 'home'; ui.dept = isAdmin(p) ? '*' : p.dept; ui.view = isAdmin(p) ? 'team' : 'home'; render();
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.a === 'set-approver') return setApprover(e.target.dataset.id, e.target.value);
  if (e.target.id !== 'imp' || !e.target.files[0]) return;
  e.target.files[0].text().then(t => {
    try { const d = JSON.parse(t); if (!Array.isArray(d.people) || !Array.isArray(d.leaves)) throw 0; if (confirm('Replace all data on this device with this file?')) { db = d; save(); ui.me = null; sessionStorage.removeItem('allins-me'); render(); } }
    catch (x) { toast('That file isn’t a valid leave tracker backup.'); }
  });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.note.click')) { openRequest(e.target.dataset.b, e.target.dataset.n); return; } if (e.key === 'Escape' && sheet !== null || e.key === 'Escape' && $('#overlay').classList.contains('on')) closeSheet(); });

/* another tab or window on this device changed the data: refresh, and alertCheck() inside render() raises the notification */
window.addEventListener('storage', e => {
  if (e.key !== KEY) return;
  const me = cur(), before = me ? db.notes.filter(n => n.to === me.id).length : 0;
  db = load(); render();
  const m2 = cur(); if (m2) { const mine = db.notes.filter(n => n.to === m2.id); if (mine.length > before) toast(mine[0].text); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && cur()) { db = load(); render(); } });

render();
fetchMomPH(false);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadCtl = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtl && !reloaded && !$('#overlay').classList.contains('on') && !$('#pin')) { reloaded = true; location.reload(); } });   // pick up a new version straight away
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
